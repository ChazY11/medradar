# MedRadar — governance rule-change records
#
# Every PR that changes the governance surface must add a record here. The
# `check_rule_audit.py` gate compares the changed paths with the base ref and
# fails unless a NEW record (one that did not exist at the base) covers every
# changed protected path.
#
# Protected surface:
#   .github/workflows/governance.yml
#   tools/governance/**
#   docs/governance/DATA_LICENSES.yaml
#   docs/governance/FROZEN.yaml
#
# Audit inputs excluded from protection (they are the records being validated):
#   docs/governance/RULE_CHANGES.yaml
#   docs/governance/DECISION_LOG.yaml
#   docs/governance/DATA_INVENTORY.yaml   (generated data manifest, enforced by check_licence)
schema: medradar.rule_changes.v1
updated: "2026-11-15"
changes:
  - change_id: RC-0001
    date: "2026-11-13"
    decision_id: GOV-0001
    approved_by: ChazY11
    reason: "Phase 2 hardening: licence positive inventory and content classification, freeze format 2 with per-file digests and an audited rebalance log, the rule-change audit gate, and the state-bump flow. Authorised by the owner-assigned task REFOUNDATION-002 / task-15."
    paths:
      - tools/governance/**
      - .github/workflows/governance.yml
      - docs/governance/DATA_LICENSES.yaml
      - docs/governance/FROZEN.yaml
  - change_id: RC-0002
    date: "2026-11-13"
    decision_id: GOV-0002
    approved_by: ChazY11
    reason: "REFOUNDATION-003 integration blocker: generated evidence artefacts under docs/refoundation/**/_evidence/ are exempt from the per-file data inventory (their content is still classified, so restricted formats still fail). Discovered when #32 and #35 were merged: the Evidence Core acceptance JSON is our own derived output, not third-party data. Authorised by the owner-assigned REFOUNDATION-003 integration task; flagged for owner confirmation before merge."
    paths:
      - tools/governance/check_licence.py
      - docs/governance/DATA_LICENSES.yaml
  - change_id: RC-0003
    date: "2026-11-13"
    decision_id: GOV-0003
    approved_by: ChazY11
    reason: "REFOUNDATION-003 task-21: replace the single main.head equality with the five-concept state scheme. check_state now treats a stale-but-ancestor git.head as WARN (so a merge does not fail the gate) and a non-ancestor head as FAIL; counts are validated against the observed commit; verified/release commits and tests.tested_head are ancestry-checked; bump_state.py refreshes the three blocks and the views in one command."
    paths:
      - tools/governance/**
  - change_id: RC-0004
    date: "2026-11-15"
    decision_id: GOV-0004
    approved_by: ChazY11
    reason: "PRODUCT-001: allow a restricted binary format to be committed only when it is a derived projection of a GREEN, redistributable public source and the inventory entry declares the file SHA-256 (policy.derived_binary_allowlist). Motivated by the 91k-record openFDA product snapshot, which is 13 MB compressed and 140 MB as plain JSONL. Undeclared gzip still fails, non-GREEN entries still fail, and the gate prints the allowlist reason and hash prefix. No scientific artefact or frozen result is touched."
    paths:
      - tools/governance/**
      - docs/governance/DATA_LICENSES.yaml
  - change_id: RC-0005
    date: "2026-11-15"
    decision_id: GOV-0005
    approved_by: ChazY11
    reason: "Narrow the GOV-0004 derived-binary exception: openfda_device source only, medradar/product/snapshot/*.gz path only, gzip content kind (with a .gz extension) only, 32 MiB (33554432 bytes) cap, and a SHA-256 bound to the committed file bytes. The gate now fails closed when any scope key is missing or empty and still requires a GREEN entry and a redistributable source. ELF/zip/sqlite/parquet/hdf5 are never allowed by this exception. This is not a licence expansion: it reduces the set of files the exception can cover."
    paths:
      - tools/governance/**
      - docs/governance/DATA_LICENSES.yaml
