# MedRadar — governance rule-change records
#
# Every PR that changes the governance surface must add a record here. The
# `check_rule_audit.py` gate compares the changed paths with the base ref and
# fails unless a NEW record (one that did not exist at the base) covers every
# changed protected path.
#
# Protected surface:
#   .github/workflows/governance.yml
#   tools/governance/**
#   docs/governance/DATA_LICENSES.yaml
#   docs/governance/FROZEN.yaml
#
# Audit inputs excluded from protection (they are the records being validated):
#   docs/governance/RULE_CHANGES.yaml
#   docs/governance/DECISION_LOG.yaml
#   docs/governance/DATA_INVENTORY.yaml   (generated data manifest, enforced by check_licence)
schema: medradar.rule_changes.v1
updated: "2026-11-13"
changes:
  - change_id: RC-0001
    date: "2026-11-13"
    decision_id: GOV-0001
    approved_by: ChazY11
