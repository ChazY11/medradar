# MedRadar — FROZEN research artifacts
#
# A frozen artifact is an input to a scientific claim or a record of one.
# Its bytes may not change in place: this file pins SHA-256 digests, and the
# frozen study directory pins its complete file list.
#
# To change a frozen artifact, open a dedicated commit that (a) updates the
# digest/manifest here, (b) states the reason, and (c) links the decision that
# authorised it. The governance workflow will fail until that commit exists.
#
# Reviewed by: ChazY11 (owner). Regenerate manifests with
#   python tools/governance/check_frozen.py --manifest

schema: medradar.frozen.v1
frozen_at: 2026-11-12
policy:
  rebalance: "A frozen artifact may only change in a dedicated commit that updates this file, names the reason and links the decision that authorised it. --manifest prints the current directory manifests for that review."
  scope: "Frozen files are scientific inputs or records; the study directory manifest additionally blocks unreviewed additions."
