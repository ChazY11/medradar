# ------------------------------------------------ P1 observe / change detection
  - id: B-022
    layer: observe
    priority: P1
    title: Change-point detector suite for sparse company x technology activity streams
    status: done
    owner: changepoint-eng
    writes: [medradar/intelligence/changepoint.py, tests/test_changepoint.py, docs/research/CHANGEPOINT.md]
    acceptance: >
      Naive multiplier baseline + rolling z-score + Poisson CUSUM + Poisson Bayes factor; exact API
      contract; deterministic; degenerate inputs return []; realistic sparse streams do not fire;
      tests assert a spike-vs-level-shift distinction.

  - id: B-023
    layer: observe
    priority: P1
    title: Controlled-truth detection benchmark (semi-synthetic injection)
    status: done
    owner: lead
    depends_on: [B-022]
    acceptance: >
      Known step-changes injected into real monthly stream shapes over a seeded grid of magnitudes
      and onsets; reported detection probability, detection delay (months) and false alarms per
      stream-year per detector; delay-vs-FAR frontier; leave-company-out generalisation; the naive
      baseline is included and may win.

  - id: B-024
    layer: observe
    priority: P1
    title: Real-data change alerts with FDR control and independent-source confirmation
    status: done
    owner: lead
    depends_on: [B-023]
    result: >
      DONE for FDR and the reassignment audit: 17 of 104 cells survive Benjamini-Hochberg at
      q=0.10, detectors emit 0-2 alerts each, and 94% of events have deterministic track
      assignment. NOT DONE for confirmation: no independent source exists on the current spine
      (blocks B-033). The novelty signature was measured and failed (zero new product codes in
      both alerted and control cells). Recorded as a partial completion, not a success.

  - id: B-025
    layer: observe
    priority: P1
    title: Cross-company anomaly detection (are competitors moving together?)
    status: done
    owner: unassigned
    depends_on: [B-024]
    acceptance: >
      Detect simultaneous increases in the same technology track across multiple independent
      companies, with a pre-registered definition of "same window" and a null model for coincident
      activity; report false-positive behaviour on shuffled labels.

  - id: B-026
    layer: observe
    priority: P1
    title: Spike vs sustained level-shift classifier for alerts
    status: todo
    owner: unassigned
    depends_on: [B-023]
    acceptance: >
      Alerts classified as transient spike / level shift / ramp with measured accuracy on injected
      known-shape changes; only sustained changes are promoted to "technology change" status.

