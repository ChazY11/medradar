# ------------------------------------------------ cycle 3 follow-ups (new)
  - id: B-033
    layer: observe
    priority: P0
    title: Identify a genuinely independent confirmation source for detected changes
    status: blocked
    owner: unassigned
    acceptance: >
      A source whose publication path is INDEPENDENT of the FDA filing system (e.g. ClinicalTrials
      trials table, hiring snapshots, patent publications, supplier/procurement records with real
      dates) is ingested with point-in-time knowledge time; confirmation of detected changes is then
      tested against matched control periods. This is the Understand-layer entry condition: without
      it, "a detected change is real" cannot be asserted. Explicitly NOT satisfied by splitting the
      same filing system into two pathways.

  - id: B-034
    layer: observe
    priority: P1
    title: Quarterly aggregation and density-stratified detection
    status: done
    owner: unassigned
    depends_on: [B-023]
    acceptance: >
      The detection benchmark re-run at quarterly resolution and with pre-declared density strata
      (S-LO / S-MID / S-HI by material-event count), so that the small-shift regime and the
      spike-versus-level-shift question can be tested where monthly resolution is underpowered.
      Report whether the detector ranking changes with resolution.

  - id: B-035
    layer: observe
    priority: P1
    title: Separate technical activity from product maintenance
    status: done
    owner: unassigned
    acceptance: >
      A defensible filter for 510(k) "Special" submissions (modifications of the filer's own
      existing device), which are ~15% of the lane, so that a detected activity change is closer to
      a technology change. Report the effect on cell counts and on the detection benchmark.

  - id: B-036
    layer: observe
    priority: P1
    title: Taxonomy churn control (versioned mapping with effective dates)
    status: done
    owner: unassigned
    depends_on: [B-032]
    acceptance: >
      Product-code -> track assignments carry an effective date, and the detector masks any cell
      whose recent events rest on codes created in the last N months. Demonstrates the share of
      alerts that are taxonomy churn rather than activity change.

  - id: B-037
    layer: observe
    priority: P1
    title: Seasonal and lane-volume artifact adjustment
    status: todo
    owner: unassigned
    acceptance: >
      Month-of-year and lane-wide volume effects estimated and removed (or explicitly conditioned on)
      before detection; the January deficit and boundary-volume artifacts documented in the design
      review are quantified and either corrected or stated as an upper bound on the false-alarm rate.


  - id: B-038
    layer: observe
    priority: P0
    title: Bin-width sweep to locate the resolution crossover
    status: done
    owner: lead
    depends_on: [B-034]
    acceptance: >
      Re-run the controlled-truth benchmark at 1, 2, 3, 4 and 6 month bins with identical
      onsets-in-calendar-time, horizon and alarm budget. Report detection probability per detector
      and the expected count per bin at each width, and test whether the naive-to-likelihood
      crossover tracks the expected count per bin rather than the aggregation label. This decides
      which detector the OBSERVE layer should actually deploy, and whether the D-018 mechanism
      hypothesis survives.


  - id: B-039
    layer: observe
    priority: P0
    title: Fix the OBSERVE deployment resolution and re-calibrate there
    status: todo
    owner: lead
    depends_on: [B-038]
    acceptance: >
      Choose the resolution the layer will actually operate at (justified by the analyst's decision
      cadence), express every detector's memory in calendar time, re-run the bin-width sweep on that
      panel, and only then name a detector. Report the identifiability check: if the ranking is still
      unstable across the memory parameterisation, the honest output is "no detector is identifiable"
      rather than a choice.


  - id: B-040
    layer: observe
    priority: P0
    title: Collect ClinicalTrials.gov DEVICE trials with device-track mapping
    status: todo
    owner: lead
    depends_on: [B-033]
    acceptance: >
      Ingest device-relevant ClinicalTrials.gov studies (the device-intervention filter already
      exists in medradar/clinical.py) into a lane mapped to the DEVICE track taxonomy, with
      first-posted as the knowledge time and sponsor strings normalised through the same
      deterministic entity normaliser. Report coverage against the 104 detection cells; then run
      the independent-confirmation test (detected regulatory changes vs matched control periods).
      This is the only currently identified path to answering "is the detected change real?".
