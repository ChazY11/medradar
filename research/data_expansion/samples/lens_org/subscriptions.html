ownloads are also available on request. See the <a href=\"https://support.lens.org/knowledge-base/patseq-bulk-download/\">documentation<\/a> for full details and read the <a href=\"https://about.lens.org/patseq-bulk-download-tou/\">Terms of Use<\/a> and <a href=\"https://about.lens.org/privacy/\">Privacy Policy.<\/a>';x['subscription.qklk.individual.contact'] = 'Contact Support';x['subscription.checkout.faq.cost.afford.answer'] = 'We\'ve introduced the Lens Equitable Access Program (LEAP) to ensure all users can access the Lens tools regardless of their financial standing. The Lens affirms that no one will be disadvantaged by lack of access to Lens.org tools. If a user legitimately needs these tools, and can demonstrate that they cannot afford the suggested price, The Lens commits to finding a way to subsidize the price or otherwise provide access. <a href=\"/lens/collective-action/leap\">Apply for Equitable Access<\/a>.';x['patent.filedTitle'] = 'Filed:';x['results.graphical.chart.historical.vis.types.description'] = 'The “historical” visualisation type is a date histogram, optionally split by facet for a single metric, binned by a date field on the x axis. So for example “Top 10 Applicants per Filing Date”. An example without a facet might be “All Patents per Expiry Date”.';x['scholar.facets.date.partial.range.advice'] = 'Use this date filter to include all publications with a partial publication date, which have been converted to a complete date where only partial date information is available for a scholarly work. Note this filter may not accurately represent the actual publication date of scholarly works.';x['priority_claim.linkage_type.PATENT_TO_UTILITY'] = 'Cited application changed from patent to utility';x['common.analysis'] = 'Analysis';x['user.workarea.rows'] = 'rows';x['home.masthead.title'] = 'Explore global science and technology knowledge';x['user.saved.queries.delete.sure'] = 'This saved query will be permanently deleted. Are you sure?';x['scholar.badge.tooltip.clinical_trial'] = 'Has Clinical Trial';x['patentResults.private'] = 'Private';x['pricing.institutional.description'] = 'Public-good institutions wanting to manage, markup, and promote knowledge assets.';x['quick.search.search.tips'] = '<p><b>Booleans:<\/b>Boolean operators must be in capitals: <em>e.g. <code>\'robot <span>AND<\/span> engine\'<\/code>, or <code>\'car <span>OR<\/span> boat\'<\/code> or <code>\'cat <span>NOT<\/span> dog\'<\/code>. <span>&amp;&amp;<\/span> is an alias for <span>AND<\/span> and <span>||<\/span> is an alias for <span>OR<\/span> and <span>!<\/span> is the alias for NOT.<\/em> Parentheses can be used to group search terms. <em>e.g. <code>\'(wheat <span>AND<\/span> grain) <span>OR<\/span> (sorgum <span>AND<\/span> barley)\'<\/code><\/em><\/p><p><b>Fields <em style=\"font-size: .7rem; \" class=\"far fa-info-circle col-sec\" tooltip-title=\"Fields are case sensitive\"><\/em> :<\/b> Search a specific field in the index (or fields) use \'field:term\': <em>e.g. \'title:(leishmani* <span>AND<\/span> diagnos*) || abstract:(leishmani* <span>AND<\/span> diagnos*) <span>&amp;&amp;<\/span> classification_cpc: (A61K* <span>OR<\/span> C12N*)<\/em><br><\/p><p><b>Wildcards:<\/b><em>e.g. *, ?, and regular expressions like /ar[gb]on/<\/em><\/p><p><b>Fuzziness and Proximity Search:<\/b>To perform a fuzzy search use the tilde, \"~\", symbol at the end of a Single word Term. For example to search for a term similar in spelling to \"roam\" use the fuzzy search:<code>roam~<\/code>. To perform a proximity search, add the tilde, \"~\", symbol to the end of a phrase suffixed with a number indicating the maximum edit distance of words in the phrase. For example, <code>\"quick fox\"~4<\/code> searches for <em>quick<\/em> and <em>fox<\/em> within 4 words from each other.<\/p><p><b>Range Searches:<\/b>Range Queries allow one to match documents whose field(s) values are between the lower and upper bound specified by the Range Query. Range Queries can be inclusive or exclusive of the upper and lower bounds. Sorting is done lexicographically.<code>date_published:[2002-01-01 TO 2003-01-01]<\/code><\/p><p>This will find documents whose date_published fields have values between 2002-01-01 and 2003-01-01, inclusive. Note that Range Queries are not reserved for date fields. You could also use range queries with non-date fields:<code>title:{Aida TO Carmen}<\/code><\/p><p>This will find all documents whose titles are between Aida and Carmen, but not including Aida and Carmen. Inclusive range queries are denoted by square brackets. Exclusive range queries are denoted by curly brackets.<\/p><p><b>Language:<\/b>To search in a language other than English, use the \"Query Tools\" section at the bottom of the sidebar filters.<\/p><p><b> Query Syntax: <\/b>For more details on the query syntax used, see <a href=\"https://www.elastic.co/guide/en/elasticsearch/reference/current/query-dsl-query-string-query.html#query-string-syntax\" target=\"_blank\">Elasticsearch Query string query<\/a>.<\/p><p>For more information see our <a class=\"text-link\" href=\"//support.lens.org/knowledge-base/search-syntax/\">Search Syntax<\/a>, <a class=\"text-link\" href=\"//support.lens.org/knowledge-base/boolean-logic-tutorial/\">Boolean Logic tutorial<\/a> and <a class=\"text-link\" href=\"https://support.lens.org/knowledge-base/boolean-operators/\">Boolean Operators Tutorial<\/a><\/p>';x['user.profile.custom.url'] = 'Profile URL';x['user.profile.feature.career.summary.text'] = 'Get immediate insight into an author/inventor’s total work output, influence and citations as well their intellectual property.';x['user.account.subscribe'] = 'Confirm & Subscribe';x['common.to'] = 'to';x['cap.faq.patent.waiver'] = 'Is Lens CAP a solution to the COVID Patent Waiver?';x['filters.query.lang.ru'] = 'Russian';x['user.workarea.history.delete.item'] = 'Delete History Item?';x['filters.flag.has_full_text'] = 'Has Full Text';x['filters.class_national.symbol'] = 'US Classi bscription to an';x['user.tags.rename.warning'] = '<b>Notice:<\/b> Add one Tag at a time using only letters, numbers and underscores. Any spaces will be replaced with an underscore.';x['cap.faq.financial.support.answer.1'] = 'Be a champion for inclusive access to knowledge to support problem solving! Tell a friend about Lens.org today!';x['common.by'] = 'by';x['itk.tools.core.tags'] = '<a href=\"https://support.lens.org/knowledge-base/tagging/\" target=\"_blank\"><b>Tagging:<\/b><\/a>  Tag and retrieve important documents.';x['itk.core.diagram.scholarly.link'] = 'View Scholarly Search';x['results.graphical.create.analysis'] = 'Create your own analysis';x['home.data.diagram.patents'] = 'Patents';x['reports.feature.export'] = 'Export and Share';x['subscription.scholar.agg.api'] = 'CALCULATE METRICS';x['results.graphical.scale.description'] = 'Linear scale preserve proportional differences. Square Root scale is shorthand for power scales with an exponent of 0.5, indicating a square root transform. Logarithmic scale are useful for plotting data that varies over multiple orders of magnitude. <a class=\"text-link\" href=\"https://vega.github.io/vega-lite/docs/scale.html\" target=\"_blank\">Read More...<\/a>';x['export.scholar.fieldLabel.FUNDING'] = 'Funding';x['pricing.common.login'] = 'Sign in';x['results.graphical.wizard.journals'] = 'Journals';x['user.request.access'] = 'Request Access';x['common.info'] = 'Additional Info';x['common.info.unavailable'] = 'Information Currently Unavailable';x['cap.landing.crisis.shared.para'] = 'Until now, access to knowledge and the tools to use it has predominantly been through for-profit corporations, with expensive closed data that can’t be shared, siloed behind paywalls or on surveilled platforms, where the hidden cost lies in privacy and confidentiality. But discovering and analyzing research, science and business knowledge that informs what’s known and who and which the actors are is big business, estimated at well over US$1.5 billion a year, much of it paid by universities and public institutions. The real costs are vastly greater: much of the world is excluded from contributing and countless opportunities are lost.';x['search.submit'] = 'Submit Search';x['results.graphical.wizard.scatter.patents'] = 'Scatter Plot (Patents)';x['scholar.common.retraction.updates'] = 'Retraction Updates';x['explore.citations.allDocs.alert'] = 'All Document (Blank) searches are too large and resource intensive to support citation joins. Please submit a query or refine your search and try again...';x['search.structured.scholar.set.description'] = 'Updates are performed on a fortnightly basis at the present time.';x['results.graphical.wizard.works.institutions.citing.patents'] = 'Top Institutions by Citing Patents';x['subscription.qklk.patseq.downloads'] = 'PatSeq Data Sequence Downloads';x['export.format'] = 'Export file format';x['subscription.form.purpose'] = 'Purpose/Requirements';x['collection.common.linked.queries.include'] = 'Include Saved Queries in collection';x['user.summary.queries.join'] = 'Join Query';x['results.workspace.frequent.items'] = 'Frequently used Collections and Dashboards will appear here.';x['user.reports.publish'] = 'Publish';x['breadcrumb.search'] = 'Search';x['labs.apps.sars.cov2.description'] = 'Nature Biotechnology Collections assembed to show some of the steps we have taken to move us towards open innovation cartography that can inform collective action by consortia, by individual institutions and by motivated people. For shared and existential crises such as COVID or climate change, building bridges between diverse domains of knowledge and expertise will be critical to meet the challenge.';x['user.profile.source.orcid.lens'] = 'source: ORCID + Lens';x['priority_claim.linkage_type.PCT_REGIONAL_FILING'] = 'PCT application claimed as a regional filing';x['filters.scholar.country'] = 'Institution Country/Region';x['common.mag.short'] = 'Microsoft Academic';x['home.form.bridging.cultu etails in the manuscript, and will be adding to, and further organizing, this repository in the next few months.';x['subscription.plan.created'] = 'Created';x['subscription.patseq.quick.links.notice'] = '<b>Notice:<\/b> <p class=\"list-icons--meta\">See the <a href=\"https://about.lens.org/patseq-bulk-download-tou/\">PatSeq Bulk Download Terms of Use<\/a> for licence details and definitions of academic and commercial use. Rich Plans include access to FASTA files. Rich file formats are only available for download via the <a href=\"https://support.lens.org/knowledge-base/patseq-bulk-download-api-documentation/\">PatSeq Bulk Download API.<\/a><\/p>';x['user.saved.queries.no.match.filter'] = 'No saved queries match that filter';x['results.graphical.chart.missing.values'] = 'Missing Values';x['common.go.back'] = 'Go Back';x['home.data.diagram.families.tip.text'] = 'Simple Patent Families. A patent family is a collection of patent applications covering the same or similar technical content. The family information gives you an understanding of the document’s international applicability through simple family members.';x['scholar.common.clinical.trial.details'] = 'Clinical Trial Details';x['subscription.checkout.checkout'] = 'Checkout';x['subscription.access.detail.first.record'] = 'First Record';x['results.graphical.wizard.multi.date'] = 'Multi Date Histogram';x['scholar.field.author.affiliation.name.exact'] = 'Institution';x['itk.core.diagram.patent.text'] = 'In addition to hosting and serving over 127 million global patent metarecords, our patent search capabilities offer advanced boolean functions, structured search, biological search, classification search, filtering and sorting options to find the most relevant and important patents.  With the new patent architecture integrated in the UI, users will have more than 120 fields to explore including multi family information and legal status/events.';x['subscription.landing.how.to.access'] = 'How to Access <b>APIs &amp; Data<\/b>';x['results.dashboard.patent.by.type'] = 'Patent documents by Type';x['home.data.diagram.works.cited.patents'] = '5.2M Works Cited in Patents';x['itk.tools.licence.permissions.para.1'] = 'Any legal entity that is incorporated for the purpose of advancing the public-good can apply for an Institutional Toolkit. Once approved, the institution will get a license for <a class=\"text-link\" href=\"/lens/institutions/faq#termsDefinitions\">Institutional Use<\/a> permitting;';x['user.account.workarea.disabled'] = '{0} days until your professional Work Area will be disabled';x['user.profile.privacy.account.delete.text'] = 'No longer need your account? Click here to delete your account. This can\'t be undone, so we recommend exporting all relevant work prior to requesting deletion.';x['export.scholar.fieldLabel.FIELDS_OF_STUDY'] = 'Fields of Study';x['export.scholar.fieldLabel.MAG_ID'] = 'Microsoft Academic ID';x['scholar.common.mesh.det.qualifier.ui'] = 'Qualifier UI';x['search.structured.short'] = 'Structured';x['article.forward.citation.count'] = 'Please load these results as a full search in order to access filtering, sorting, annotations, collection management and more.';x['common.matches'] = 'matches';x['pricing.faq.workspace.subscribe.answer.3'] = 'by following the payment prompts. Renewal payments are not automatic. You will receive a reminder email one month before the end of your subscription to renew and authorize payment.';x['user.registration.institution.support.cap.tip'] = 'Supporting Institutions will be listed on an open registry of ITK subscribers that support collective action based on open, verifiable, and shareable data.';x['pricing.faq.workspace.subscribe.answer.2'] = 'for a Trial or Professional account , you can then subscribe from your';x['user.registration.use.case.trial'] = 'Trial';x['user.profile.following'] = 'Following';x['itk.what.is'] = 'What is an Institutional Toolkit';x['pricing.faq.users.free'] = 'Is The Lens free?';x['results.graphical.interval'] = 'Interval';x['advancedPatentSearch.field'] = 'Field';x['results.graphical.compare.preset.list'] = 'Select from our list of pre-sets';x['explore.citations.scholarly.cited.scholarly.text'] = 'These are the Scholarly Works that are cited by (referenced by) the Scholarly Works in the original result set.';x['results.graphical.wizard.authors.citing.works'] = 'Top Authors by Citing Scholarly Works';x['user.collections.type.PATENT'] = 'Patent Records';x['user.signIn.to.use'] = 'to use';x['labs.apps.data'] = 'Community Apps & Data';x['pricing.common.trial'] = 'Trial';x['filters.workspace.title'] = 'Your Workspace';x['user.history.deleteAll.title'] = 'Delete all search history?';x['cap.faq.low.price.answer.3'] = 'Our commitment to inclusive access to knowledge and LEAP, allows us to focus on enabling useful and actionable knowledge, not building expensive constraints and paywalls. Another reason the low prices are possible is because of 20 years of generous support from philanthropic donors and foundations who helped The Lens to build the foundation that we have today.';x['cap.faq.low.price.answer.4'] = 'But the most important reason we can maintain low prices is because of you. Inclusive access means more people access the platform. Community-supported infrastructure that really has the support of the community allows us to distribute costs across a wide base; it doesn’t require a lot of money from each participant when there are lots of participants! The Lens believes that knowledge should be like the roads - infrastructure that facilitates the human activities of commerce and culture and as a result benefits us all.';x['cap.faq.low.price.answer.1'] = 'Well, actually, it is free for everyone on earth if they wish to access and use the site anonymously (i.e. as an unregistered guest user). Which is a pretty low price, we admit.';x['cap.faq.low.price.answer.2'] = 'Our secret sauce is that we build on the contributions of others in the public-good space: open source software, open data, open access publishing and new open machine learning tools. This is only possible with these shared approaches and it increases our quality rapidly and drops costs dramatically.';x['common.disabled'] = 'Disabled';x['cap.participate.itk.para.4'] = 'Institutional Toolkits are available through subscriptions which can be subsidized through LEAP, to help institutions optimally access, manage, and share open content for shared evidence. An ITK subscription also enables institutions to signal their commitment to global collective action that is based on more open and shared evidence.';x['savedQuery.type.PATENT'] = 'Patents';x['notes.user.add.note'] = 'Add Note';x['results.graphical.chart.classification.info'] = 'Classification Info';x['subscription.scholar.agg.api.text'] = 'The Aggregation API enables users to run the same aggregation requests used to power the analysis charts and metrics available in the user interface and more, allowing users to perform their own analyses across the entire scholarly works dataset.';x['filters.flag.in_analytics_set'] = 'Analytics Set';x['user.workarea.set.actions.intersect'] = 'Intersect';x['export.patent.fieldLabel.NPL_RESOLVED_CITATION_COUNT'] = 'NPL Resolved Citation Count';x['subscription.landing.itk.fair.data.text'] = 'Findable, Accessible, Interoperable, Reusable and open patent and scholarly datasets with permission to embed or integrate and expose patent and scholarly metadata, metrics and analytics.';x['common.reports.data.base.collection'] = 'Select base collection';x['itk.tools.reports'] = 'Lens Reports';x['results.graphical.wizard.doc.list'] = 'Document List';x['results.tab.citing'] = 'Citing Patents';x['user.workarea.project.details'] = 'Project Details';x['common.load'] = 'Load';x['boolean.query.status'] = 'Query Status';x['itk.roadmap.development.lead'] = 'The package of tools included in the Institutional Toolkit will be extended as we expand the Lens core functionality and develop additional tools for institutions. Subscribing institutions will be able to vote on their preferred ITK development priorities. We welcome feedback and input into the ITK roadmap to help us prioritize the tools and features institutions want most.';x['anno.tour.next'] = 'Next';x['pricing.open.public.access'] = 'Open<br>Public Access';x['common.facet.switch'] = 'Switch Facets';x['journal.source'] = 'Journal / Source';x['cap.why.enabling.innovation.para.1'] = 'What do we mean by this? Innovation without Borders is of course intended to resonate with those who know how Médecins Sans Frontières approaches the challenges of humanity. And the borders are sometimes nations, sometimes mindsets, sometimes barriers to knowledge and to coordinating action - as we say at The Lens ‘Informed by Evidence, Inspired by Imagination’';x['cap.why.enabling.innovation.para.2'] = 'The Collective Action Project (CAP) is a multi-year initiative to shift how we work together to solve problems - the big ones. This initiative bridges the boundaries and removes roadblocks to science- and technology-enabled problem solving and the partnering it requires.';x['cap.why.enabling.innovation.para.3'] = 'The project will ensure open access to shared innovation knowledge and inclusive access to the data and tools needed to solve our collective crises. Developed in consultation with leadership at the WHO, WIPO, CEPI, World Trade Organization, UNEP, the Office of the Principal Scientific Advisor of India, and leading Universities, the project is guided by our Lens Equitable Access Program (LEAP) to provide equitable access for all institutions and ensure the ongoing sustainability of The Lens as a community-supported platform. ';x['cap.why.enabling.innovation.para.4'] = 'The launch of the Collective Action Project coincides with a major new release featuring enhanced patent functionality - including more than 120 indexed fields, APIs and legal status information - and Institutional Toolkits, which include Attested Portfolios, the new Report Builder, Embeddable Widgets and much more. Through LEAP, The Lens guarantees inclusive and equitable access to these toolkits and functionality to all institutions for public-good use.';x['results.view.custom.journal.source'] = 'Journal / Source';x['common.group.apply'] = 'Apply Groupings';x['cap.landing.solututions.shared'] = 'Solutions must be shared';x['collection.common.dynamic.make.tip'] = 'This Dynamic Collection is automatically updated from your linked Saved Queries when new items are added to our search index';x['filters.flag.has_claim'] = 'Has Claim';x['cap.participate.itk.para.1'] = 'The open, transparent, and verifiable knowledge from The Lens is an alternative to closed, proprietary services that restrict access rather than encourage it.';x['cap.faq.collection.action.answer.2'] = 'The most acute collective crises we face are failures of the commons: climate and ecosystem degradation, global health, massive economic and innovation inequity. Collective action is essential to solving these crises - it means that what we do can contribute to a solution. This is collective but not necessarily collaborative. Collaboration is critical, but not prescriptive for collective action. For example a company that shifts to solar cells is part of collective action to address climate change.';x['cap.faq.collection.action.answer.3'] = 'To enable collective action we must have trust and find mutual self-interest. Thus there is a critical need for open, verifiable and shareable knowledge.';x['cap.participate.itk.para.3'] = 'Based on open, verifiable, and shareable data, the toolkit allows the exploration of innovation knowledge, facilitates informed decision-making, fosters partnerships across discipline silos, and enables institutions to build trust in the collective action required to solve society’s crises. The toolkit includes site-wide permissions, high volume APIs, branded and attested collections and portfolios, Lens Report Builder, institutional profiles, customisable alerts and more.';x['scholar.flag.open_access.tip'] = 'Open Access status is determined using open access evidence data from <a href=\"https://unpaywall.org/\" target=\"_blank\">Unpaywall<\/a>, <a href=\"https://openalex.org/\" target=\"_blank\">OpenAlex<\/a>, <a href=\"https://doaj.org/\" target=\"_blank\">DOAJ<\/a> journal list (where the work is published after the journal DOAJ listing date), listing in <a href=\"https://www.ncbi.nlm.nih.gov/pmc/\" target=\"_blank\">PubMed Central<\/a> or availability in an \"rXiv\" preprint repository, including <a href=\"https://arxiv.org/\" target=\"_blank\">ArXiv<\/a>, <a href=\"https://www.biorxiv.org/\" target=\"_blank\">bioRxiv<\/a>, <a href=\"https://chemrxiv.org/\" target=\"_blank\">ChemRxiv<\/a> and <a href=\"https://www.medrxiv.org/\" target=\"_blank\">medRxiv<\/a>. Please note: scholarly works that are not categorised as Open Access have no evidence available from these data sources and does not mean they are not Open Access.';x['cap.participate.itk.para.2'] = 'To facilitate this, The Lens designed the Institutional Toolkits (ITK) to support discovery, navigation and measurement of innovation knowledge and enables evidence-based decision making from shared knowledge through the Lens.org platform. These tools are designed to enable the workflow of public-good and commercial institutions at the lowest possible price to help reduce the barriers to innovation.';x['cap.faq.collection.action.answer.1'] = 'We have to think differently about solving problems together, shared knowledge and informed partnerships are the key. But as important, we must behave differently. When problems affect us all, and these are complex problems, we must solve them as a societal priority in all locations and impacted populations. This requires trust, and shared knowledge is key to that trust.';x['itk.price.tier.150-500k'] = '150,001 - 500,000';x['scholar.sort.scholarly.citations.short'] = 'Citing Works';x['query.met '] = 'Select Files';x['itk.faq.a1'] = 'The toolkit is available for both public-good and commercial institutions under a tier-based subscription plan. However, to us, inclusive innovation means that everyone has the opportunity to participate in the innovative process and to access capabilities that will inform and guide their decision-making. For these reasons, in addition to the tier-based subscription model, we are introducing a Lens Equitable Access Program (LEAP) to ensure there is inclusive access to the toolkit. if a public-good institution legitimately needs these tools, and can demonstrate that they cannot afford the suggested price, The Lens commits to adjusting the price, or finding a way to subsidize or otherwise provide access.';x['results.graphical.view.heat.map.max.value'] = 'Heatmap Max Value';x['scholar.common.open.access.license.unknown'] = 'License information unavailable or does not exist.';x['notes.patent.scope.FAMILYINFO'] = 'Family';x['results.graphical.colour.scheme.description'] = 'If the fields you are using to encode colour is quantitative it is recommended to use a sequential colour scheme. If the field is categorical then choose a categorical scheme. Note by default the colour scheme is automatically set based on the field type.';x['scholar.common.retracted'] = 'Retracted Work';x['subscription.patseq.feature.survey.link'] = 'Start PatSeq Bulk Data Survey';x['itk.faq.a9'] = 'With the launch of the Collective Action Project we have also introduced LEAP to ensure all public-good institutions can access the institutional tools regardless of their financial standing.  Through LEAP, any institution that legitimately needs these tools, and can demonstrate that they cannot afford the suggested price is eligible to apply for access through LEAP.';x['itk.faq.a8'] = 'Institutional Users are registered users that are affiliated with an institution that has an ITK subscription via the institutional account. The Lens provides access to three types of users on the Lens.org platform with some important distinctions between an Individual user (anonymous or personal user) and an Institutional User. For more information on Institutional Users see the <a class=\"text-link\" <a href=\"#termsDefinitions\">terms and definitions<\/a>.';x['itk.faq.a6'] = 'Institutional toolkits provide a private and secure workspace where you can choose what is made public and which users have access. Your use of the Lens is your business, not ours. We do not monetize the user’s journey and it is up to you to choose what work area items are public. Read more about our approach to privacy and security in our <a class=\"text-link\" href=\"https://about.lens.org/privacy/\">privacy policy<\/a>.';x['itk.faq.a5'] = 'Institutional Toolkit licenses are available for both public-good and commercial institutions. ITKs do allow for commercial use depending on the institution type and use case.';x['itk.faq.a4'] = 'Institutions will be able to provide  input into the development roadmap to help guide the development of new features and functionality for institutional toolkits. Institutional accounts will be able to vote on development priorities and suggest new features for development.';x['itk.faq.a3'] = 'Institutional toolkits are available through annual subscriptions, renewable every 12 months.';x['subscription.api.quick.links.support'] = 'Support';x['quick.search.empty.bucket'] = 'Your Search bucket is currently empty';x['export.format.json.legacy.text'] = 'JSON uses a legacy data schema that will be deprecated. JSON Lines uses the same data schema as the <a href=\"https://docs.api.lens.org/response.html\" class=\"text-link\" target=\"_blank\">API response<\/a>. We recommended replacing legacy JSON exports with JSON Lines exports.';x['user.registration.institution.support.cap'] = 'My institution supports <a href=\"/lens/collective-action\" class=\"text-link\">collective action<\/a>.';x['results.graphical.chart.filtered.values.restrict'] = 'Restric ated event. A \"manual\" event is when the user specifies the items to add or remove from a collection. This includes:<\/p><ul class=\"list-styled\"><li>Importing items into a collection by uploading a list of identifiers<\/li><li>Selecting one or more results in a search results list <\/li><li>Adding to collection from an individual patent / scholarly work page<\/li><\/ul><p><b>The types of Add and Remove events include:<\/b><\/p><ul class=\"list-styled\"><li><strong>Added Manually:<\/strong> Add event for items added manually to a collection.<\/li><li><strong>Added via Search:<\/strong> Add event for items manually added to a collection from a search and includes the originating search query details for the add event.<\/li><li><strong>Added via Linked Query:<\/strong> Add event for dynamic collections when new items are added to the collection from a linked saved query and includes the saved query details for the add event.<\/li><li><strong>Removed Manually:<\/strong> Remove event for items manually removed from a collection.<\/li><li><strong>Removed via Search:<\/strong> Remove event for items manually removed from a collection via a search and includes the originating search query details for the remove event.<\/li><\/ul>';x['explore.citations.patents.cited.patents.text'] = 'The Patent documents that are cited by the Patent documents in the original result set.';x['user.profile.collaborative.ratio'] = 'Collaborative Ratio';x['home.form.placeholder.profiles'] = 'Search by Author or Inventor Name';x['subscription.checkout.faq.cost.afford'] = 'What if I can\'t afford the cost?';x['itk.partners.locale.GB'] = 'United Kingdom';x['user.workarea.claim.recorded'] = 'Recorded';x['starting.wizard.heading.enjoy'] = 'Enjoy The Lens';x['common.auto'] = 'Auto';x['advancedPatentSearch.predicate'] = 'Predicate';x['cap.faq.inno.cartography.answer.2'] = 'Innovation Cartography provides knowledge \"maps\" in specific disciplines or technology areas to identify the linked actors and inform about partnerships, opportunities, risks and trajectories. Innovation Cartography makes information enabled for decision making and action. It is a priority for The Lens to build more capabilities around Innovation Cartographies, such as the Lens Report Builder, in order to make the underlying knowledge as accessible, understandable and deployable as possible.';x['user.collections.selected'] = 'selected Collections';x['itk.partners.locale.FR'] = 'France';x['cap.faq.inno.cartography.answer.1'] = 'Innovation Cartography is a process to view, analyze and understand knowledge in a way that enables action and decision making. The Lens is building an open platform for Innovation Cartography that is built on open content and tools but can have access rights that match the requirements of the user. In the patent world, an Innovation Cartography can be compared to a patent landscape. In the scholarly works domain, Innovation Cartography is similar to a dramatically expanded and dynamically updated literature review.';x['search.table.author'] = 'Author';x['subscription.patent.lead'] = 'Access the full corpus of Lens patent records using the flexibility and convenience of a REST Search API, Aggregation API or bulk data downloads. The versioned API allows you to perform and combine several types of searches using a range of different operations or aggregations.';x['patent.document.family.missing.identifier.text'] = 'Preliminary Family Status: We currently do not have sufficient metadata to reliably calculate the patent family for this publication. While every care has been taken to calculate the family accurately, it might change in the coming weeks as further metadata becomes available.';x['subscription.api.quick.links.active.access'] = 'Active Access';x['itk.price.commercial.institutions.para'] = 'Our commercial institution subscription program is also a tiered price plan that is based on the use case, commitment to attribution, patent or scholarly API or bulk data specifications, and the size/revenue of the institution. Interested institutions are encouraged to enquire and discuss their use case in more detail with the Lens business team. Commercial Institutions are any legally incorporated entities, including corporations, LLCs and LLPs, whose principal purpose is to make money; including publishers, innovative businesses, investors, law firms, consultancies, or contract research organizations. Additional API plans, bulk datasets or commercial use packages are also available:';x['notes.user.editor'] = 'Notes Editor';x['user.registration.account.subtext'] = 'Create a personal account so you can access the full suite of features The Lens has to offer.';x['subscription.scholar.option.3.lead'] = 'Access the Lens scholarly works with bulk data downloads.';x['pricing.table.use.commercial.tip'] = 'Commercial Use is defined as any use of Lens data that results in a business or corporate outcome - financial or otherwise. If you\'re using The Lens in the course of your employment by a for-profit company, this comprises commercial use. This includes professionals, consultants and attorneys working across the research and innovation sectors. Examples of Commercial Use include, but are not limited to, any of the following: commercial research and development, data services and products, consultancy reports, legal services and counsel, investment decisions, etc.';x['pricing.account.institutional.non.profit.heading'] = 'Institutional Toolkit';x['itk.heading.btn.explore'] = 'Explore The Toolkit';x['home.socials.twitter'] = 'X (Twitter) Feed';x['results.graphical.chart.historical'] = 'Historical';x['results.graphical.wizard.funders.over.time'] = 'Funding Organisations Over Time';x['scholar.facets.flags.full.text.disclaimer'] = 'Only snippets of full text are provided at this time.';x['searchBar.refineSearch'] = 'Refine Search';x['export.scholar.fieldLabel.END_PAGE'] = 'End Page';x['journal.volume'] = 'Volume';x['labs.landing.getting.indexed.ou d analytics. Featured capabilities including portfolios, allowing institutional capabilities to be showcased, discovered in context and promoted.';x['home.menu.patseq.biological.toolset'] = 'Biological Toolset';x['user.profile.toolbar.manage.authoship'] = 'Manage Authorship in Work Area';x['scholar.common.identifiers.pmid'] = 'PubMed';x['results.graphical.colour.redyellowblue'] = 'redyellowblue';x['labs.collab.scaling.science.description'] = 'Initiated collaboration with data sharing with the Scaling Science project at the MIT Media Lab. The Scaling Science project aims to leverage large-scale network analytics to develop models/algorithms that can be used to increase the efficiency of scientific funding. As part of this collaboration, the analytics underlying DELPHI, an early-warning signal for high-impact research (which is currently in review for publication) were re-written to utilize the Lens Labs data (instead of Microsoft Academic and AMiner data, which was used previously). The corresponding dataset, as well as the computed metrics, will be released upon publication of the underlying paper, and additional work is ongoing.';x['labs.apps.CiteSource'] = 'CiteSource';x['search.tips.patent.data'] = 'Patent Data & Jurisdictions';x['common.cookie.notice.title'] = 'Cookies Notice';x['home.form.scholarly.works'] = 'Scholarly Works';x['home.data.diagram.scholarly.tip.text'] = 'scholarly records, compiled and harmonised from Microsoft Academic, PubMed and Crossref, enhanced with OpenAlex and UnPaywall open access information and links to ORCID. The full scholarly citation graph is provided for the first time as an open public resource.';x['scholar.common.open.access.license.pd'] = 'Public domain equivalent license are licenses that grant public-domain-like rights or/and act as waivers.';x['results.graphical.set.limits'] = 'The Analytics Set limits results to scholarly works that have useful metadata for visualization and analysis. The criteria for the analytics set are user.profile.orchid.linked'] = 'ORCID linked';x['subscription.request.api.access.option'] = 'Trial Access';x['scholar.field.source.type'] = 'Source Type';x['common.view.more'] = 'View More';x['labs.collab.iii.description'] = 'The Innovation Information Initiative (I3) is a data collaborative for open innovation data and related analytics, tools, and metrics.  This includes global patent datasets, citation graphs among + between patents and scholarship, and metrics or secondary datasets derived from these.';x['common.load.more'] = 'Load more';x['export.scholar.fieldLabel.AUTHORS'] = 'Author/s';x['itk.tools.view.roadmap.para'] = 'Check out our development roadmap to see what new tools are coming down the pipeline or view pricing.';x['patent.documents.family.jurisdictions.limit'] = 'Limit results to patent documents with one or more simple family members in the selected jurisdiction.';x['pricing.faq.workspace.cost'] = 'How much does a commercial workspace cost?';x['subscription.api.quick.links'] = 'Quick Links';x['itk.roadmap.development'] = 'Development Roadmap';x['preset.analysis.preview.patent.technologies.text'] = 'This analysis sidebar provides a visual overview of the Technologies associated with your search results, including the top <b>CPC Classifications<\/b>, <b>IPCR Classifications<\/b>, <b>US Classifications<\/b>, <b>Biological Organisms<\/b> associated with sequences and the <b>Sequence Types<\/b>.';x['inventorship.button.remove'] = 'Remove Inventorship';x['user.account.workarea.locked'] = 'Work Area Locked';x['patent.percent.force'] = 'Percent of patents not in force';x['scholar.common.author.identifiers.description'] = 'By default, author values are grouped by their display name, which can result in the aggregation of scholarly works from different authors with the same name. Enabling author identifiers uses the identifiers available in our data sources to group authors, which can help disambiguate different authors with the same name. The author identifiers used currently include Microsoft Academic, and ORCID identifiers if they are available in data from CrossRef or PubMed.';x['user.collections.hasnone'] = 'You don\'t have any collections';x['patent.view.flag.has.legal_status.granted'] = 'Indicates if the patent application/simple family has been granted in one or more jurisdictions.';x['bio.patseqexplorer'] = 'PatSeq Explorer';x['labs.apps.patseq.description'] = 'Access to the human genome map of patent sequences for academic use, and all 350M patent sequences disclosed in the patent literature. The Lens offers this service to enable you to download sequence listings extracted from full-text patents, megafiles, and public databases in two data formats: 1) Rich OR 2) FASTA format. In addition and for academic use only we offer a dataset for patent sequences that were mapped on the human genome in 2014-2015.';x['subscription.scholar.more.about.text'] = 'Building on the constructive user feedback from the initial API release, we have expanded API and now offer more flexibility in the way Lens data can be used. Lens Scholarly API includes a number of performance improvements.';x['user.subscriptions'] = 'Subscriptions';x['search.structured.patent.filter.date.range'] = 'Date Range';x['reports.feature.interoperable.data.text'] = 'Lens Reports are based on FAIRE data, which not only not only meets the FAIR standards of Findability, Accessibility, Interoperability, and Reusability, but is also Enabling.';x['results.graphical.wizard.cited.by.patents'] = 'Most cited by Patents';x['user.profile.privacy.mfa.disable'] = 'Disable 2FA';x['subscription.landing.itk.secure.account'] = 'Secure Institutional Account';x['common.action.deleting'] = 'Deleting';x['itk.faq.terms'] = 'Terms and Definitions';x['user.profile.privacy.dnt'] = 'You have DNT (Do Not Track) enabled in your browser so none of your actions on The Lens are recorded in our analytics system.';x['preset.analysis.legal_status'] = 'Legal Status';x['scholar.common.libkey  you from every other researcher. You can connect your iD with your professional information — affiliations, grants, publications, peer review, and more.';x['collection.common.dynamic.descriptions'] = 'Dynamic collections are automatically updated when new items are added to our search index. Stay up to date with emails and notifications then choose to accept or reject new items into your collection. ';x['sorting.cited.patent.count'] = 'Cited Patent Count';x['patent.document.family.extended'] = 'Extended Family';x['starting.wizard.step.2.heading'] = 'Privacy Options';x['pricing.account.institutional'] = 'Institutional Account';x['results.graphical.view.vert.bar.verbose'] = 'Vertical Bar Chart';x['cap.faq.why.collective.action.answer.2'] = 'Digital abundance of information means that using the linked knowledge accessible through The Lens can help public institutions save as much as US$1 billion annually while making the resources accessible to more people than can access them today. We can waste no time to redeploy resources to support productive outcomes and solve problems.';x['notes.patent.scope.CITATIONS'] = 'Citations';x['reports.save.clipboard'] = 'Saved to Lens Clipboard';x['subscription.faq.free-trial.text'] = 'The APIs are available to all users for a free 14-day trial. For ongoing use, we provide API access via an <a href=\"/lens/institutions\">Institutional Toolkit<\/a> subscription or data agreement. Bulk data is only provided with a subscription. If you are interested in bulk data, we encourage you to trial the API or download the sample bulk data first. Pricing is based on your use case, attribution plan, the institution type and requirements for access volumes and rates. Contact us to discuss your API and data needs. <a class=\"feedbackLink\" href=\"/lens/feedback?returnTo=/\" target=\"_blank\">API & Data Enquiry<\/a>';x['cap.faq.why.collective.action.answer.1'] = 'Humanity faces an unprecedented urgency to address the problems that we collectively face and what that impact on equitable access might be.';x['cap.why.tsunami.para.3'] = 'There are urgent calls for a COVID Patent Waiver or other intellectual property relief to stimulate changes to render innovation more equitable. Almost all the countries that are calling for such changes, are also hamstrung in both their domestic capabilities and their ability to negotiate because they lack affordable, transparent knowledge of the innovation process, especially patents and research works.';x['export.patent.fieldLabel.CITED_BY_PATENT_COUNT'] = 'Cited by Patent Count';x['filters.collections.expand'] = 'Expand by Simple Family';x['inventorship.is.this.you'] = 'Is This You? Record inventorship';x['status.error.query.tips.list'] = 'Check Lens field names for errors and start new search';x['scholar.common.open.access.license.cc0'] = 'Public Domain Dedication, allows others may freely build upon, enhance and reuse the works for any purposes without restriction under copyright or database law.';x['patentField.ipc.definition'] = 'The International Patent Classification (IPCR), provides for a hierarchical system of language independent symbols for the classification of patents and utility models according to the different areas of technology to which they pertain. N.B. Formatting differences; The \'invention\' symbols are in bold and the \'additional\' are in a normal font weight.';x['user.collections.intersect.error'] = 'Could not generate intersection';x['tooltip.new.search'] = 'New Search for';x['scholar.field.citation_id_type.cited'] = 'Identifier Type';x['cap.why.tsunami.para.2'] = 'Unfortunately, that leaves more than 80% of the world’s population - mostly in poorer countries across the global south - with inadequate access to vaccines, therapeutics and diagnostics. This inequity will impact everyone, and can only be dealt with by collective action.';x['cap.why.tsunami.para.1'] = 'July 2021 marked 18 months since the publication of the genetic sequence of SARS-Cov-2, the virus that causes COVID-19. Unprecedented scientific progress and government investment in partnering has led to effective vaccines already protecting nearly a billion people.';x['user.account.using.for.commercial.text'] = 'Individual users who use the platform in their work for a for-profit entity must have a commercial use subscription. This includes staff, consultants, contractors or employees of any business, law firm, LLC, LLP,  Corp. or equivalent in any country. This ensures compliance with The Lens <a href=\"https://about.lens.org/policies/\" target=\"_blank\">Terms of Use<\/a> and helps to sustain The Lens, with funds going towards supporting <a href=\"https://www.lens.org/lens/collective-action/leap\" target=\"_blank\">equitable access<\/a> and open innovation knowledge for everyone.';x['results.graphical.view'] = 'Analysis';x['user.authorship.notice.text.no.orcid'] = 'To record your authorship and upload scholarly works to your ORCID record requires a linked ORCID account.';x['labs.apps.BibliZap'] = 'BibliZap';x['tour.search.step.4.text'] = 'The search bar contains your query. This is optional, but usually you start by typing a keyword in here. Click the question mark icon on the right to get search tips.';x['itk.core.diagram.bio.text'] = 'This is the world’s largest publicly available database with internal transparency metrics. Choose among the 5 apps available to search and analyse the DNA, RNA and protein sequences found in patents and how these can inform innovation or shape strategies for research or product development.';x['query.metrics.patent.extended.families'] = 'Extended Families';x['filters.flag.hasOrcid'] = 'Has ORCID iD';x['pricing.platform.overview'] = 'The Lens Platform Overview';x['common.soon'] = 'coming soon';x['user.profile.no.works.found'] = 'No Scholarly Works found';x['export.specialCharactersNotAllowed'] = 'Special characters are not allowed in the filename';x['scholar.common.issue'] = 'Issue';x['scholar.common.recommended'] = 'Re ggested price is eligible to apply for access through LEAP.';x['scholar.common.author'] = 'Author';x['filters.biologicals.nucleotide'] = 'Nucleotide';x['labs.apps.in4m'] = 'Lens In4M Metric';x['user.sharing.LIMITED_ACCESS.info.sub'] = 'Anyone with the link can view';x['home.menu.reports.builder'] = 'Report Builder';x['home.menu.tour'] = 'Feature Tour';x['boolean.query.status.unrecognised.fields'] = 'Unrecognised fields';x['user.tags.patent.search'] = 'New patent search for tag';x['cap.landing.participation.modes.lead'] = 'The Collective Action Project provides a number of different activities for all stakeholders to participate in collective problem solving. There are six categories of participation to support collective action:';x['home.menu'] = 'Menu';x['scholar.common.dossier'] = 'dossier';x['labs.apps.covidlens.description'] = 'The goal of the covidlens dataset package is to make the Lens Collection of Covid-19 patents and scientific literature created by Osmat Jefferson and the Lens team available to the R and wider patent analytics community. This package bundles the data into two data frames for patents and literature that you can access and work with in R. The patents dataset consists of 43,075 patent publications (applications, grants, design patents) that are relevant to COVID-19, MERS and SARS and subjects such as respirators and surgical masks. The literature dataset consists of 66,233 scientific publications on the same subjects.';x['common.access'] = 'Access';x['cap.participate.sponsorships.list'] = '<li>Content quality enhancements or expansion of the Lens MetaRecord to include additional content, e.g. patent examination and litigation information (PTAB, Public PAIR, etc.), new taxonomies, retraction information for scholarly works, etc.<\/li><li>Sponsor training for Lens.org power users for a specific region or globally. For example, country outreach managers to support understanding and use of The Lens in a specific regional or territory.<\/li><li>Find an expert functionality to expose the most relevant actors in any discipline or technology sector.<\/li><li>Citation and event alert notifications to inform users when new citations are added (including scholarly, patent and non-patent literature citations), when patent legal status changes or when legal events occur to patent families.<\/li><li>Localization for Lens.org in new languages or support with the existing languages.<\/li>';x['labs.apps.nih.icite.description'] = 'iCite is a powerful web application that provides a panel of bibliometric information for scientific publications within a defined analysis group (where an analysis group can consist of a single article or a very large group of articles). The data produced by iCite can be downloaded as a customized report from the dashboard and could be used to understand the influence of articles within an analysis group.';x['pricing.common.update.date'] = 'See <a href=\"https://about.lens.org/changes-to-accounts/\" target=\"_blank\">Changes to Accounts<\/a> for more information.';x['subscription.patent.agg.api.lead'] = 'Access the Aggregations API endpoint to perform aggregation operations, calculate metrics and summarize data for analysis.';x['collection.common.view.in'] = 'View in Collection';x['common.error.collection.not.found'] = 'Collection Not Found';x['results.graphical.family.group.tip'] = 'Only family members for the first 100,000 patents in your initial search are supported at this time. Please consider further refining your initial search to view all family members in your result.<br><br><b>Note:<\/b> All other filters are applied to your query before the family grouping.  Visualisations do not reflect family groupings.';x['filters.landscapes.items'] = 'Show documents in the Landscape';x['query.metrics.scholarly.citations.tip'] = 'The sum of citing scholarly works for all cited scholarly works in the result set';x['subscription.scholarly.works'] = 'Lens Scholarly Works';x['home.data.diagram.sequences.start'] = 'Start Searching Biological Sequences';x['results.graphical.colour.orange'] = 'Orange';x['subscription.patent.more.about'] = 'More About Our <b>Patent API<\/b>';x['subscription.api.quick.links.docs.bulk.downs'] = 'Bulk Data Documentation';x['subscription.plan.expires'] = 'Expires';x['about.controls.previous'] = 'Previous';x['results.graphical.wizard.patent.legal.status'] = 'Patents by Legal Status';x['reports.subscribe.for.access'] = 'Subscribe to ITK for Access';x['labs.apps.covidlens'] = 'Covidlens';x['user.profile.privacy.account.delete.modal.password'] = 'Enter your password to confirm';x['subscription.form.org.terms.comply'] = 'I have read and will comply with the';x['pricing.faq.itk'] = 'Institutional and Enterprise Toolkits';x['patent.legalEvents.table.class'] = 'Class';x['user.tags.patent.filter'] = 'Filter current patent search tag';x['cap.leap.para.4'] = 'The Lens affirms that no one will be disadvantaged by lack of access to The Lens platform and tools. If a user legitimately needs these tools, and can demonstrate that they cannot afford the suggested price, The Lens commits to finding a way to subsidize the price or otherwise provide access.';x['cap.leap.para.5'] = 'The Lens also affirms that no institution will ever be disadvantaged by lack of access to Lens.org institutional tools. If an institution legitimately needs these tools, and can demonstrate that they cannot afford the suggested price, The Lens commits to adjusting the price, or finding a way to subsidize or otherwise provide access.';x['user.workarea.history.patcite'] = '<strong>PatCite<\/strong> History.';x['user.authorship.remove.claim.description'] = 'You have recorded your authorship over this work. If you have incorrectly claimed this work, please remove your claim.';x['subscription.landing.leap'] = 'Through the Lens Equitable Access Program (LEAP), The Lens affirms that no one will be disadvantaged by lack of access to Lens.org platform or tools.';x['results.graphical.untitled.iframe'] = 'Untitled Iframe';x['patentView.espacenet'] = 'View in Espacenet';x['scholar.common.pmids'] = 'PMIDs (PubMed)';x['support.suggestions'] = 'Suggestions';x['subscription.patseq.rich.format.text'] = 'It is a custom annotated flat file format, which is based on the European Molecular Biology Laboratory (EMBL) file format but modified to accommodate rich patent metadata (see documentation for more details). The format enables access to both the sequences and their corresponding patent metadata, as a yearly subscription with monthly updates. We provide the entire collection of biological sequences disclosed in patents for download in this file format. To evaluate the data, please download Rich file (1,000 sequences, Rich format 2.48mb).';x['user.profile.linked.services.text'] = 'Link your accounts from third party services to your Lens profile. We currently support LinkedIn and ORCID accounts.';x['user.registration.institution.type'] = 'Institution Type';x['subscription.landing.lead'] = 'The Lens API &amp; Data facility provides additional options for accessing Lens data.';x['sorting.extended.family.size'] = 'Extended Family Size';x['itk.tools.view.pricing.btn'] = 'View Pricing';x['common.create'] = 'Create';x['cap.leap.para.2'] = 'LEAP is a core-value of The Lens as well as a program to ensure equitable access to innovation knowledge for collective action. Under LEAP, every person in the world can use the platform anonymously for free with powerful analytic tools. Any registered user can benefit from personalized workspaces and customized features - at no cost for personal public-good users, or for a modest cost for commercial use.';x['home.recent.news'] = 'Our Recent News';x['common.action.hide'] = 'Hide';x['cap.leap.para.3'] = 'Any institution worldwide that needs or wants any of the tools or services in the Institutional Toolkit will have access based on low, fair, tiered pricing. All fees go towards keeping knowledge universally available as a community-supported public-good. Through LEAP we are offering these Institutional Toolkits at no cost to all public-good institutions across much of the Global South - almost 130 countries - including universities, libraries, government agencies, NGOs and civil society.';x['home.promise.steadfast.title'] = 'Steadfast - Always Reliable';x['cap.leap.para.1'] = 'The Collective Action Project is guided by the Lens Equitable Access Program (LEAP) to provide equitable access for all institutions and charts a pathway towards community-supported autonomous financing of The Lens, to keep it inclusive, growing, open and comprehensive.';x['user.profile.toolbar.authorship'] = 'Authorship';x['user.workarea.orcid.sync'] = 'Sync';x['common.media.sort.oldest'] = 'Sort by Oldest';x['filters.funding'] = 'Funding';x['user.collections.publish.longDesc'] = 'Access Settings';x['query.metrics.cites-patents'] = 'Cites Patents';x['itk.toolkit.license'] = 'License and Permissions';x['patent.document.toolbar.share'] = 'Share Patent';x['results.graphical.wizard.step1'] = 'What would you like to analyse?';x['chart.title.pub_year.citing'] = 'Counts of citing patents based on publication date';x['results.graphical.wizard.step2'] = 'Choose a visualisation';x['filters.flag.isDiamond'] = 'Non-APC Journals';x['patentResults.queryTools.inventorship'] = 'Inventorship';x['user.patseq.license'] = 'Subscription Plan';x['user.saved.queries.none'] = 'No Saved Queries Yet';x['home.form.dates'] = 'Dates';x['user.workarea.try.again'] = 'Try Again';x['results.graphical.wizard.individual.patent'] = 'Individual Patent';x['boolean.query.change.type'] = 'Try changing query type.';x['search.new.structured.search'] = 'New Structured Search';x['mailchimp.join.description'] = 'Join our newsletter to receive frequent news updates, and notice on feature releases. We don\'t share or sell your information ever.';x['quick.search.your.selection'] = 'Your Selection';x['labs.apps.scholar.bulk'] = 'Lens Scholarly Bulk Data';x['search.toolbar.relevance.tip'] = '<p>Relevance is based on the query matching score used in Elasticsearch.<\/p><p>The document matching score for a search term is increased:<\/p><ul><li>The shorter a matching field is, e.g. a matching title would score higher than a matching abstract<\/li><li>The more times the term is matched to the document<\/li><\/ul><p> The document matching score for a search term is decreased if the term is common over all documents and therefore less specific than other terms.  <\/p><p><a href=\"https://www.elastic.co/guide/en/elasticsearch/guide/current/scoring-theory.html\" target=\"_blank\" class=\"styled-link\">Read more about relevance scoring here<\/a><\/p>';x['search.structured.search.limitations.text'] = '<p>The Structured Search form allows you to build a boolean query using basic field-value pairs.<\/p><p>Unfortunately, this means that more complex boolean queries containing multiple predicates (e.g. <span class=\"col-meta\">a OR b AND c<\/span>) or nested clauses (e.g. <span class=\"col-meta\">a OR title:(b OR c)<\/span>) are not able to be parsed back into the simple form structure.<\/p><p>For queries like this, please use our provided Query Text Editor.<\/p><p>Some third party apps like <a href=\"https://www.2dsearch.com/\" target=\"_blank\">2Dsearch<\/a> also provide the ability to visually build complex Boolean Queries and submit them to The Lens.<\/p>';x['wizard.scholarly.text'] = 'Works include Journal Articles, Book Chapters, Conference Proceedings, Components, Books and more.';x['cap.faq.what.is.lens.answer'] = 'The Lens is a project designed to provide inclusive access to knowledge so that more people can participate in innovation and problem solving. Originally launched as \'Patent Lens\', The Lens has been running continuously for more than 20 years.';x['results.graphical.wizard.authors.single.over.time'] = 'Single Author Affiliation Over Time';x['patent.legal.status.PATENTED.description'] = 'PCT applications that have been gr
