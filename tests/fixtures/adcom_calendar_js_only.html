<!doctype html>
<html><body>
<!-- Trimmed structure of the real page captured 2026-11-02 from
     https://www.fda.gov/advisory-committees/advisory-committee-calendar
     The calendar table ships only <thead>; Drupal/DataTables fills <tbody>
     rows client-side, so a static fetch contains zero meetings. -->
<div class="lcds-datatable">
  <table class="lcds-datatable--advisory-committee-calendar table table-bordered">
    <thead>
      <tr>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Meeting</th>
        <th>Contributing Office</th>
        <th>Center</th>
      </tr>
    </thead>
  </table>
</div>
<section class="views-element-container block block-views block-views-blockadvisory-committee-datatable-block-4">
  <div class="view-content">
    <div><div class="datatable-current-date">
      <li class="lcds-description-list__item">
        <div>
          <h2 class="lcds-description-list__item-heading">Content current as of:</h2>
          <p class="lcds-description-list__item-text"><time datetime="2026-10-30T07:55:31-04:00">10/30/2026</time></p>
        </div>
      </li>
    </div></div>
  </div>
</section>
</body></html>
