name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} offline suite + wheel smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Offline test suite (no network)
        run: python -m medradar selftest
      - name: CLI smoke test
        run: |
          python -m medradar --help
          python -m medradar status --db data/none.sqlite
      - name: Config loads from the installed wheel (temp cwd)
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import json, medradar.config as c; from medradar.config import load_companies; assert c.CONFIG_DIR.is_dir(), c.CONFIG_DIR; assert c.CONFIG_ORIGIN == 'installed', c.CONFIG_ORIGIN; n = len(load_companies('device').all()); assert n > 0, n; print(json.dumps({'config_dir': str(c.CONFIG_DIR), 'origin': c.CONFIG_ORIGIN, 'home': str(c.ROOT), 'companies': n, 'share': [str(p) for p in c.share_candidates('config')]}))"
      - name: Installed wheel resolves config from a non-repo cwd
        # Builds + installs the wheel into a throwaway --target, then imports
        # medradar from outside the checkout and asserts config/companies/tracks
        # came from share/medradar/config, not the source tree.
        run: python scripts/check_install.py
      - name: Offline demo smoke test (must not touch the network)
        run: medradar demo

  data-stats:
    name: offline data stats (fixture mini DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Data-scale stats tests (synthetic mini DB, no network)
        # tests/test_stats_cmd.py builds tests/fixtures/stats/mini_events.json
        # into a throwaway SQLite file; nothing touches data/ or the network.
        run: python -m unittest tests.test_stats_cmd -v
      - name: data_stats JSON contract smoke (fixture mini DB)
        run: |
          python -c "import json, tempfile; from pathlib import Path; from tests.test_stats_cmd import build_mini_db; from medradar.stats_cmd import data_stats, growth_row; tmp = tempfile.mkdtemp(); stats = data_stats(build_mini_db(Path(tmp) / 'mini.sqlite')); assert stats['status'] == 'ok', stats['status']; assert stats['events']['total'] == 5, stats['events']['total']; assert stats['events']['by_year'] == {'2019': 1, '2020': 2, '2021': 1}, stats['events']['by_year']; print(json.dumps({'events': stats['events']['total'], 'by_year': stats['events']['by_year'], 'growth': growth_row(stats)}, ensure_ascii=False))"

  windows-install:
    name: windows data-files + demo
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Offline test suite (no network)
        run: python -m medradar selftest
      - name: Config loads from the installed wheel (temp cwd)
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import json, medradar.config as c; from medradar.config import load_companies; assert c.CONFIG_DIR.is_dir(), c.CONFIG_DIR; assert c.CONFIG_ORIGIN == 'installed', c.CONFIG_ORIGIN; n = len(load_companies('device').all()); assert n > 0, n; print(json.dumps({'config_dir': str(c.CONFIG_DIR), 'origin': c.CONFIG_ORIGIN, 'home': str(c.ROOT), 'companies': n, 'share': [str(p) for p in c.share_candidates('config')]}))"
      - name: Wheel data-files on Windows (--target install from a temp cwd)
        run: python scripts/check_install.py
      - name: Nightly script dry run (no collectors, stats only)
        # Proves scripts/nightly.ps1 parses and its stats stage works on an
        # empty database (a checkout has no data/): exits 0 without touching
        # docs/DATA.md.
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/nightly.ps1 -SkipCollect -SkipTrade -SkipReplay -SkipAnalyze -SkipReport -NoDataMd
      - name: Offline demo smoke test
        run: medradar demo

  product-workbench:
    name: product workbench (API contract + data semantics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install product + test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,product]'
      - name: Product test suite (snapshot-backed, no network)
        run: python -m pytest tests/product -q
      - name: Committed UI build is present
        run: python -c "from pathlib import Path; assert Path('web/dist/index.html').is_file(); assert (Path('medradar/product/snapshot/snapshot.json')).is_file(); print('committed snapshot and UI build present')"
      - name: Serve smoke test (in-process API)
        run: |
          python -c "from fastapi.testclient import TestClient; from medradar.product.api import create_app; client = TestClient(create_app()); health = client.get('/api/health'); assert health.status_code == 200, health.text; meta = client.get('/api/meta').json(); events = client.get('/api/events?page_size=10').json(); assert events['total'] > 0; print({'status': health.json()['status'], 'organizations': meta['coverage']['tracked_organizations'], 'records': meta['coverage']['total_records'], 'events_page': len(events['items'])})"

  data-pipeline:
    name: DATA-001 pipeline (offline unit and fault-injection suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pipeline + test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,product]'
      - name: Pipeline test suite (no network)
        run: python -m pytest tests/data_pipeline -q
      - name: CLI smoke test
        run: |
          python -m medradar.data_pipeline --help
          MEDRADAR_PIPELINE_ROOT=build/ci-empty python -m medradar.data_pipeline status --json
      - name: API status is explicit without a pipeline database
        run: |
          python -c "from fastapi.testclient import TestClient; from medradar.product.api import create_app; c=TestClient(create_app()); b=c.get('/api/data-status').json(); assert b['configured'] is False, b; assert b['state']=='not_configured'; assert b['terminology']['real_time_claim'] is False; print({'state': b['state'], 'sources': len(b['sources'])})"

  data-pipeline-web:
    name: DATA-001 data-status web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build the workbench
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: The committed build must contain the new route
        run: |
          python -c "from pathlib import Path; html=Path('web/dist/index.html').read_text(); assert 'index-' in html; print('web build present')"
          grep -R "Data synchronization" web/dist
