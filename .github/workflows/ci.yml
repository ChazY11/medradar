name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline test suite (no network)
        run: python -m medradar selftest
      - name: CLI smoke test
        run: |
          python -m medradar --help
          python -m medradar status --db data/none.sqlite
