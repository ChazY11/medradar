name: weekly-radar

# Rebuilds the radar every Monday 05:00 Asia/Shanghai (Sunday 21:00 UTC) and
# publishes the self-contained dashboard to GitHub Pages via the docs/ folder.
#
# Requires: Settings -> Pages -> Source = "Deploy from a branch", Branch = main /docs.

on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect, analyze, render (free public data only)
        # No API key: openFDA allows 1,000 requests/day per IP, and 60 months of
        # history needs roughly 200. Everything is cached inside the job.
        run: python -m medradar run --months 60 --with-trade

      - name: Show summary
        run: |
          python -m medradar status
          ls -la docs

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs out/metrics.json 2>/dev/null || true
          git add docs
          if git diff --cached --quiet; then
            echo "no changes this week"
          else
            git commit -m "chore(radar): weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
